spring.application.name=guardia-fogo-api

# Configuração Oracle.
# Use variáveis de ambiente para não versionar usuário e senha reais.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USER:guardia_fogo}
spring.datasource.password=${ORACLE_PASSWORD:guardia_fogo}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

server.port=${SERVER_PORT:8080}
